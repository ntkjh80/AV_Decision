<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
<title id="title">질문 목표 분기 기준의 세 층</title><desc id="desc">questions는 관측할 질문, target은 영상별 목표, thresholds는 후보와 보류를 가르는 공통 기준입니다.</desc>
<style>
svg { --bg:#fafbfc; --ink:#192d3e; --muted:#526776; --panel:#edf3f7; --accent:#156e83; --line:#95a9b6; background:var(--bg); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
@media (prefers-color-scheme:dark) { svg { --bg:#14212c; --ink:#ecf3f7; --muted:#b7c7d2; --panel:#223746; --accent:#8cd4e3; --line:#78909e; } }
text { fill:var(--ink); font-size:18px; } .heading {font-size:25px;font-weight:600;} .small {font-size:16px;fill:var(--muted);} .box {fill:var(--panel);rx:14;} .flow {fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow);} .accent {fill:var(--accent);} .line {stroke:var(--line);stroke-width:1.5;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect width="1040" height="400" fill="var(--bg)"/>
<text class="heading" x="32" y="42">조건은 세 곳에 서로 다른 의미로 들어갑니다</text><rect class="box" x="32" y="86" width="288" height="242"/><text x="52" y="123" class="heading">질문</text><text x="52" y="152" class="small">questions.road_wet</text><text x="52" y="192">무엇을 관측할까요?</text><text x="52" y="232" class="small">젖은 노면의 단서가 보이나요?</text><text x="52" y="263" class="small">yes / no / unknown</text><text x="52" y="294" class="small">모든 영상에 질문 전달</text><rect class="box" x="376" y="86" width="288" height="242"/><text x="396" y="123" class="heading">목표</text><text x="396" y="152" class="small">record.target</text><text x="396" y="192">이번 영상의 목표는?</text><text x="396" y="232" class="small">road_wet: yes</text><text x="396" y="263" class="small">등록한 질문을 목표에 지정</text><text x="396" y="294" class="small">목표 비교 대상에 포함</text><rect class="box" x="720" y="86" width="288" height="242"/><text x="740" y="123" class="heading">분기 기준</text><text x="740" y="152" class="small">thresholds</text><text x="740" y="192">어느 경우에 보류할까요?</text><text x="740" y="232" class="small">선택 확률과 1·2위 차이</text><text x="740" y="263" class="small">시간 공백과 원본 관측 주기</text><text x="740" y="294" class="small">현재는 모든 질문의 공통 기준</text><text class="small" x="32" y="370">질문을 추가하는 것과, 그 질문을 자동 분기에 사용하는 것은 별도 설정입니다.</text>
</svg>