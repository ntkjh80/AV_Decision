<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 385" role="img" aria-labelledby="title desc">
<title id="title">2Hz와 복제된 10fps의 시간 정보</title><desc id="desc">원본 A B C 세 관측을 더 많은 프레임으로 반복 저장해도, 원본 관측 사이 0.5초 공백은 유지됩니다.</desc>
<style>
svg { --bg:#fafbfc; --ink:#192d3e; --muted:#526776; --panel:#edf3f7; --accent:#156e83; --line:#95a9b6; background:var(--bg); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
@media (prefers-color-scheme:dark) { svg { --bg:#14212c; --ink:#ecf3f7; --muted:#b7c7d2; --panel:#223746; --accent:#8cd4e3; --line:#78909e; } }
text { fill:var(--ink); font-size:18px; } .heading {font-size:25px;font-weight:600;} .small {font-size:16px;fill:var(--muted);} .box {fill:var(--panel);rx:14;} .flow {fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow);} .accent {fill:var(--accent);} .line {stroke:var(--line);stroke-width:1.5;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect width="1040" height="385" fill="var(--bg)"/>
<text class="heading" x="32" y="42">저장 fps가 늘어도 독립 관측은 늘지 않습니다</text><text class="small" x="32" y="74">설명을 위한 복제 저장 예시 · 새로운 움직임을 관측한 것이 아닙니다.</text><text x="32" y="136">원본 2Hz</text><text x="32" y="236">복제 저장 10fps</text><line class="line" x1="225" x2="925" y1="130" y2="130"/><line class="line" x1="225" x2="925" y1="230" y2="230"/><circle cx="225" cy="130" r="20" fill="var(--panel)" stroke="var(--accent)"/><text x="225" y="136" text-anchor="middle">A</text><text class="small" x="225" y="174" text-anchor="middle">0.0초</text><circle cx="575" cy="130" r="20" fill="var(--panel)" stroke="var(--accent)"/><text x="575" y="136" text-anchor="middle">B</text><text class="small" x="575" y="174" text-anchor="middle">0.5초</text><circle cx="925" cy="130" r="20" fill="var(--panel)" stroke="var(--accent)"/><text x="925" y="136" text-anchor="middle">C</text><text class="small" x="925" y="174" text-anchor="middle">1.0초</text><rect class="box" x="207" y="212" width="36" height="36" rx="6"/><text x="225" y="236" text-anchor="middle">A</text><rect class="box" x="277" y="212" width="36" height="36" rx="6"/><text x="295" y="236" text-anchor="middle">A</text><rect class="box" x="347" y="212" width="36" height="36" rx="6"/><text x="365" y="236" text-anchor="middle">A</text><rect class="box" x="417" y="212" width="36" height="36" rx="6"/><text x="435" y="236" text-anchor="middle">A</text><rect class="box" x="487" y="212" width="36" height="36" rx="6"/><text x="505" y="236" text-anchor="middle">A</text><rect class="box" x="557" y="212" width="36" height="36" rx="6"/><text x="575" y="236" text-anchor="middle">B</text><rect class="box" x="627" y="212" width="36" height="36" rx="6"/><text x="645" y="236" text-anchor="middle">B</text><rect class="box" x="697" y="212" width="36" height="36" rx="6"/><text x="715" y="236" text-anchor="middle">B</text><rect class="box" x="767" y="212" width="36" height="36" rx="6"/><text x="785" y="236" text-anchor="middle">B</text><rect class="box" x="837" y="212" width="36" height="36" rx="6"/><text x="855" y="236" text-anchor="middle">B</text><rect class="box" x="907" y="212" width="36" height="36" rx="6"/><text x="925" y="236" text-anchor="middle">C</text><text class="small" x="225" y="292">A 반복</text><text class="small" x="575" y="292">B 반복</text><text class="small" x="906" y="292">C</text><text x="225" y="347">A와 B 사이의 0.5초 공백은 그대로 남습니다.</text>
</svg>