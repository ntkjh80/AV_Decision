<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 405" role="img" aria-labelledby="title desc">
<title id="title">영상 의미 재분류 흐름</title><desc id="desc">생성 영상을 시간순 프레임으로 관측하고, 생성 목표와 사후 비교하여 검수와 수정 제안을 만듭니다.</desc>
<style>
svg { --bg:#fafbfc; --ink:#192d3e; --muted:#526776; --panel:#edf3f7; --accent:#156e83; --line:#95a9b6; background:var(--bg); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
@media (prefers-color-scheme:dark) { svg { --bg:#14212c; --ink:#ecf3f7; --muted:#b7c7d2; --panel:#223746; --accent:#8cd4e3; --line:#78909e; } }
text { fill:var(--ink); font-size:18px; } .heading {font-size:25px;font-weight:600;} .small {font-size:16px;fill:var(--muted);} .box {fill:var(--panel);rx:14;} .flow {fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow);} .accent {fill:var(--accent);} .line {stroke:var(--line);stroke-width:1.5;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect width="1040" height="405" fill="var(--bg)"/>
<text class="heading" x="32" y="42">요청한 장면과 실제 관측을 나눠 기록합니다</text><rect class="box" x="32" y="86" width="190" height="84"/><text x="127.0" y="118" text-anchor="middle">생성된 영상</text><text class="small" x="127.0" y="146" text-anchor="middle">파일과 출처</text><rect class="box" x="290" y="86" width="190" height="84"/><text x="385.0" y="118" text-anchor="middle">시간순 프레임</text><text class="small" x="385.0" y="146" text-anchor="middle">실제 시각과 함께</text><rect class="box" x="548" y="86" width="190" height="84"/><text x="643.0" y="118" text-anchor="middle">관측 모델</text><text class="small" x="643.0" y="146" text-anchor="middle">공통 질문에 답하기</text><rect class="box" x="806" y="86" width="200" height="84"/><text x="906.0" y="118" text-anchor="middle">관측 라벨</text><text class="small" x="906.0" y="146" text-anchor="middle">선택지와 점수</text><path class="flow" d="M222 128 H282"/><path class="flow" d="M480 128 H540"/><path class="flow" d="M738 128 H798"/><rect class="box" x="290" y="255" width="190" height="84"/><text x="385.0" y="287" text-anchor="middle">생성 목표</text><text class="small" x="385.0" y="315" text-anchor="middle">모델 입력과 분리</text><rect class="box" x="548" y="255" width="190" height="84"/><text x="643.0" y="287" text-anchor="middle">판정 규칙</text><text class="small" x="643.0" y="315" text-anchor="middle">목표·점수·시간 검사</text><rect class="box" x="806" y="255" width="200" height="84"/><text x="906.0" y="287" text-anchor="middle">검수와 수정 제안</text><text class="small" x="906.0" y="315" text-anchor="middle">사람이 확인할 근거</text><path class="flow" d="M480 297 H540"/><path class="flow" d="M738 297 H798"/><path class="flow" d="M906 170 V211 H643 V247"/><text class="small" x="35" y="286">같은 영상이라도</text><text class="small" x="35" y="312">목표와 관측은</text><text class="small" x="35" y="338">다를 수 있습니다.</text><text class="small" x="32" y="378">후보는 검수 전 상태이며, 물리적 타당성을 보증하지 않습니다.</text>
</svg>